---
# Builds the unsigned Windows installer for a v*-pyrowave.* tag with the
# regular Windows pipeline and publishes it as a GitHub release, using
# release_notes/<tag>.md from the tagged commit as the description.
# Run it by hand from the branch; a tag push would put ci-windows.yml on its
# upstream symbol publishing path.
name: PyroWave release
permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v1.18.4-pyrowave.1
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ inputs.tag }}"
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve tag
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pyrowave\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a vX.Y.Z-pyrowave.N tag."
            exit 1
          fi
          if [[ ! -f "release_notes/${TAG}.md" ]]; then
            echo "::error::release_notes/${TAG}.md is missing from the tagged commit."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  build:
    name: Windows
    needs: resolve
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ needs.resolve.outputs.commit }}
      release_version: ${{ needs.resolve.outputs.version }}
      release_tag: ${{ inputs.tag }}
      build_tests: false
      release_artifact_retention_days: 7
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      require_truehdr_runtime: false

  release:
    name: Publish release
    needs:
      - resolve
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Download installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: build-Windows
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ls -l artifacts
          installer="artifacts/VibepolloSetup-${VERSION}.exe"
          mv artifacts/VibepolloSetup.exe "${installer}"
          gh release create "${TAG}" "${installer}" \
            --verify-tag \
            --prerelease \
            --title "Vibepollo PyroWave ${TAG}" \
            --notes-file "release_notes/${TAG}.md"
